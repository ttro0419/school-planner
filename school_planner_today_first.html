<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>School Planner</title><style>
:root{--b:#f5f6f8;--c:#fff;--t:#303236;--s:#747980;--l:#dde2e8;--m:#2f80d8;--ms:#eaf3ff;--r:#e6463a;--o:#e98200;--g:#2fae55;--sh:0 6px 18px rgba(30,36,45,.07)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}body{margin:0;background:var(--b);color:var(--t);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:calc(82px + env(safe-area-inset-bottom))}header{position:sticky;top:0;z-index:9;background:rgba(245,246,248,.96);backdrop-filter:blur(14px);border-bottom:1px solid var(--l);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.head{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}.ib{width:44px;height:44px;border:1px solid var(--l);border-radius:15px;background:#fff;color:var(--m);font-size:22px}.ttl{text-align:center}.ttl b{font-size:20px}.date{font-size:13px;color:var(--s);margin-top:2px}.jump{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.jump button,.nav button{border:1px solid var(--l);background:#fff;border-radius:15px;min-height:44px;font-weight:850;color:var(--t)}.jump button.on,.nav button.on{background:var(--m);color:#fff;border-color:var(--m)}main{padding:14px}.block{scroll-margin-top:126px;margin-bottom:20px}.bt{display:flex;justify-content:space-between;align-items:end;margin:8px 2px 10px}.bt h2{font-size:21px;margin:0;font-weight:900}.bt span,.muted{color:var(--s);font-size:12px}.card{background:#fff;border:1px solid var(--l);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}.ct{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:850}.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-bottom:12px}.tabs button{min-height:46px;border:1px solid var(--l);border-radius:15px;background:#fff;font-weight:850}.tabs button.on{background:var(--m);color:#fff;border-color:var(--m)}.lesson{display:grid;grid-template-columns:46px 1fr;gap:10px;min-height:62px;padding:12px 0;border-bottom:1px solid var(--l);align-items:center}.lesson:last-child,.todo:last-child{border-bottom:0;padding-bottom:0}.per{width:42px;height:42px;border-radius:14px;background:var(--ms);color:var(--m);font-weight:900;font-size:13px;display:grid;place-items:center}.subj{font-size:16px;font-weight:850}.teacher,.room{color:var(--s);font-size:13px;margin-top:3px}.room{font-size:12px}.todo{display:grid;grid-template-columns:42px 1fr;gap:10px;min-height:68px;padding:12px 0;border-bottom:1px solid var(--l);align-items:center}.todo input{width:27px;height:27px;justify-self:center;accent-color:var(--m)}.todo-title{font-size:15.5px;font-weight:850}.todo-sub{color:var(--s);font-size:13px;margin-top:3px}.badges{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;min-height:24px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:850}.type{background:var(--ms);color:var(--m)}.high{background:#ffe7e4;color:var(--r)}.mid{background:#fff2da;color:var(--o)}.low{background:#e8f8ed;color:var(--g)}.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#e9edf2;padding:5px;border-radius:16px;margin-bottom:12px}.seg button{min-height:42px;border:0;border-radius:12px;background:transparent;color:var(--s);font-weight:850}.seg button.on{background:#fff;color:var(--m)}.form{display:grid;gap:12px}label{display:grid;gap:6px;font-size:13px;font-weight:850}input,select,textarea{width:100%;min-height:50px;padding:12px;border:1px solid var(--l);border-radius:14px;background:#fff;font-size:16px}textarea{min-height:82px}.pb,.gb{min-height:52px;width:100%;border-radius:16px;font-weight:850}.pb{border:0;background:var(--m);color:#fff}.gb{border:1px solid var(--l);background:#fff;color:var(--t)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;text-align:center}.day{min-height:62px;padding:7px 2px;border-radius:14px;background:#fafafa;border:1px solid var(--l);font-size:12px}.today{background:var(--m)!important;color:#fff;font-weight:850}.dots{margin-top:4px;color:var(--o);min-height:16px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tool{min-height:92px;text-align:left;border-radius:18px;padding:14px;border:1px solid var(--l);background:#fff;box-shadow:var(--sh)}.tool i{font-style:normal;font-size:24px}.tool b{display:block;margin-top:5px}.empty{color:var(--s);font-size:14px;padding:12px 0}.nav{position:fixed;left:0;right:0;bottom:0;max-width:520px;height:calc(76px + env(safe-area-inset-bottom));margin:auto;padding:7px 10px env(safe-area-inset-bottom);background:rgba(255,255,255,.97);border-top:1px solid var(--l);display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.toast{position:fixed;left:14px;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));max-width:492px;margin:auto;background:rgba(45,49,55,.94);color:white;padding:12px 14px;border-radius:14px;font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:none}@media(max-width:370px){main{padding:12px}.tools{grid-template-columns:1fr}.tabs{gap:5px}.tabs button{min-height:44px}}
</style></head><body><div class="app"><header><div class="head"><button class="ib" onclick="help()">？</button><div class="ttl"><b>School Planner</b><div class="date" id="date"></div></div><button class="ib" onclick="addFocus()">＋</button></div><div class="jump"><button id="j-time" class="on" onclick="go('time')">時間割</button><button id="j-todo" onclick="go('todo')">ToDo</button><button id="j-other" onclick="go('other')">その他</button></div></header><main>
<section id="timeBlock" class="block"><div class="bt"><h2>今日の時間割</h2><span>一番上に固定表示</span></div><div class="card"><div class="ct">今日の授業</div><div id="todayList"></div></div></section>
<section id="todoBlock" class="block"><div class="bt"><h2>ToDo</h2><span>宿題・提出物</span></div><div class="card"><div class="ct">ToDo追加</div><form class="form" id="form"><label>タイトル<input id="title" placeholder="例：数学問題集 p.42" required></label><label>教科<select id="subject"><option>英語</option><option>数学</option><option>国語</option><option>物理</option><option>化学</option><option>地歴</option><option>体育</option><option>その他</option></select></label><label>期限<input id="due" type="date" required></label><label>種別<select id="type"><option>宿題</option><option>提出物</option><option>小テスト</option><option>試験勉強</option><option>持ち物</option><option>その他</option></select></label><label>重要度<select id="priority"><option>高</option><option selected>中</option><option>低</option></select></label><label>メモ<textarea id="memo" placeholder="任意"></textarea></label><button class="pb">ToDoを追加</button></form></div><div class="card"><div class="ct">ToDo一覧</div><div class="seg"><button id="f-all" class="on" onclick="filter='all';renderTodo();filterUI()">すべて</button><button id="f-open" onclick="filter='open';renderTodo();filterUI()">未完了</button><button id="f-done" onclick="filter='done';renderTodo();filterUI()">完了済み</button></div><div id="todoList"></div></div></section>
<section id="otherBlock" class="block"><div class="bt"><h2>その他</h2><span>週間時間割・カレンダー・設定</span></div><div class="card"><div class="ct">曜日別時間割 <span class="muted">曜日を押して切替</span></div><div class="tabs" id="tabs"></div><div id="weekList"></div></div><div class="card"><div class="ct">明日の予定</div><div id="tomorrowList"></div></div><div class="card"><div class="ct">今週のカレンダー <span class="muted">● = 期限あり</span></div><div class="cal" id="cal"></div></div><div class="tools"><button class="tool" onclick="exportData()"><i>📤</i><b>データ書き出し</b><span class="muted">JSONで保存</span></button><button class="tool" onclick="resetTodos()"><i>↺</i><b>ToDo初期化</b><span class="muted">初期データに戻す</span></button><button class="tool" onclick="help()"><i>？</i><b>操作説明</b><span class="muted">使い方を見る</span></button><button class="tool" onclick="installGuide()"><i>📱</i><b>スマホ追加</b><span class="muted">ホーム画面に追加</span></button></div></section>
</main><nav class="nav"><button id="n-time" class="on" onclick="go('time')">▦ 時間割</button><button id="n-todo" onclick="go('todo')">☑ ToDo</button><button id="n-other" onclick="go('other')">⚙ その他</button></nav><div id="toast" class="toast"></div></div><script>
const W=[['sunday','日'],['monday','月'],['tuesday','火'],['wednesday','水'],['thursday','木'],['friday','金'],['saturday','土']],S=[['monday','月'],['tuesday','火'],['wednesday','水'],['thursday','木'],['friday','金'],['saturday','土']];
const TT={monday:[[1,'漢文','神保',''],[2,'現代文','山藤',''],[3,'数Ⅲ','望月',''],[4,'物理','永江',''],[5,'理地歴','石 / 沖 / 川','D / F / 中'],[6,'英語Ⅱ','川崎','']],tuesday:[[1,'体育Y','吉田薫',''],[2,'物理','永江',''],[3,'理地歴','石 / 沖 / 川','D / F / 中'],[4,'数演習','小宮',''],[5,'古文','野谷',''],[6,'理理数探','名 / 北 / 出 / 小','']],wednesday:[[1,'数C','藤倉',''],[2,'現 / 古','山藤 / 野谷',''],[3,'理地歴','石 / 沖 / 川','D / F / 中'],[4,'化学','淡野',''],[5,'英語Ⅲ','ウスリー',''],[6,'英Ⅰ / Ⅱ','脇濱 / 川崎','']],thursday:[[1,'数C','藤倉',''],[2,'数Ⅲ','望月',''],[3,'物理','永江',''],[4,'体育Y','吉田薫',''],[5,'化学','淡野',''],[6,'英語Ⅰ','脇濱','']],friday:[[1,'古文','野谷',''],[2,'数Ⅲ','望月',''],[3,'英語Ⅲ','ウスリー',''],[4,'英語Ⅱ','川崎',''],[5,'現代文','山藤',''],[6,'体育Y','吉田薫','']],saturday:[[1,'漢文','神保',''],[2,'英語Ⅰ','脇濱',''],[3,'化学','淡野',''],[4,'数演習','小宮','']],sunday:[]};
const $=id=>document.getElementById(id),ds=o=>{let d=new Date();d.setDate(d.getDate()+o);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`},id=()=>crypto?.randomUUID?crypto.randomUUID():'t'+Date.now()+Math.random();
const def=[{id:id(),title:'英語プリント提出',subject:'英語',due:ds(0),type:'提出物',priority:'高',completed:false},{id:id(),title:'数学問題集 p.42',subject:'数学',due:ds(0),type:'宿題',priority:'中',completed:false},{id:id(),title:'化学小テスト勉強',subject:'化学',due:ds(1),type:'小テスト',priority:'中',completed:false}];let todos=JSON.parse(localStorage.schoolPlannerSingle||'null')||def,day=W[new Date().getDay()][0],filter='all';
function save(){localStorage.schoolPlannerSingle=JSON.stringify(todos)}function today(){return W[new Date().getDay()][0]}function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return W[d.getDay()][0]}function fmt(s){let d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}function lessonHTML(a){return `<div class="lesson"><div class="per">${a[0]}限</div><div><div class="subj">${a[1]}</div><div class="teacher">${a[2]||''}</div>${a[3]?`<div class="room">${a[3]}</div>`:''}</div></div>`}function renderTT(el,k){let a=TT[k]||[];$(el).innerHTML=a.length?a.map(lessonHTML).join(''):'<div class="empty">授業なし</div>'}
function renderTabs(){$('tabs').innerHTML=S.map(x=>`<button class="${x[0]==day?'on':''}" onclick="day='${x[0]}';renderTabs();renderTT('weekList',day)">${x[1]}</button>`).join('')}function cls(p){return p=='高'?'high':p=='中'?'mid':'low'}function todoHTML(t){return `<div class="todo"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTodo('${t.id}')"><div><div class="todo-title">${t.title}</div><div class="todo-sub">${t.subject} / ${fmt(t.due)}まで</div><div class="badges"><span class="badge type">${t.type}</span><span class="badge ${cls(t.priority)}">${t.priority}</span></div></div></div>`}
function renderTodo(){let a=[...todos];if(filter=='open')a=a.filter(t=>!t.completed);if(filter=='done')a=a.filter(t=>t.completed);a.sort((x,y)=>x.due.localeCompare(y.due));$('todoList').innerHTML=a.length?a.map(todoHTML).join(''):'<div class="empty">表示するToDoはありません</div>'}function filterUI(){['all','open','done'].forEach(f=>$('f-'+f).classList.toggle('on',filter==f))}function toggleTodo(x){todos=todos.map(t=>t.id==x?{...t,completed:!t.completed}:t);save();renderTodo();renderCal();toast('ToDoを更新しました')}
function renderCal(){let c=[],now=new Date(),w=now.getDay(),off=w==0?-6:1-w;for(let i=0;i<7;i++){let d=new Date();d.setDate(now.getDate()+off+i);let s=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,n=todos.filter(t=>!t.completed&&t.due==s).length,is=d.toDateString()==now.toDateString();c.push(`<div class="day ${is?'today':''}"><div>${['月','火','水','木','金','土','日'][i]}</div><div style="font-size:16px;font-weight:850">${d.getDate()}</div><div class="dots">${n?'●'.repeat(Math.min(n,3)):''}</div></div>`)}$('cal').innerHTML=c.join('')}
function go(k){$(k+'Block').scrollIntoView({behavior:'smooth'});active(k)}function active(k){['time','todo','other'].forEach(x=>{$('n-'+x).classList.toggle('on',x==k);$('j-'+x).classList.toggle('on',x==k)})}function addFocus(){go('todo');setTimeout(()=>$('title').focus(),350)}function toast(s){let t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),1500)}
$('form').onsubmit=e=>{e.preventDefault();todos.push({id:id(),title:$('title').value.trim(),subject:$('subject').value,due:$('due').value,type:$('type').value,priority:$('priority').value,memo:$('memo').value.trim(),completed:false});save();e.target.reset();$('priority').value='中';$('due').value=ds(0);renderTodo();renderCal();toast('ToDoを追加しました')};function exportData(){let b=new Blob([JSON.stringify({timetable:TT,todos},null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='school-planner-data.json';a.click();URL.revokeObjectURL(u)}function resetTodos(){if(confirm('ToDoを初期状態に戻しますか？')){todos=def;save();renderTodo();renderCal();toast('初期化しました')}}function help(){alert('画面は上から順に「今日の時間割 → ToDo → その他」です。\n\n下のバー/上のボタンで移動。\n右上＋でToDo追加欄へ移動。\nToDoのチェックで完了/未完了を切替。')}function installGuide(){alert('iPhone: Safari → 共有 → ホーム画面に追加\nAndroid: Chrome → ︙ → ホーム画面に追加\n\nGitHub PagesのURLで開くと使いやすいです。')}
function init(){let d=new Date();$('date').textContent=`${d.getMonth()+1}月${d.getDate()}日（${W[d.getDay()][1]}）`;$('due').value=ds(0);renderTT('todayList',today());renderTT('tomorrowList',tomorrow());renderTabs();renderTT('weekList',day);renderTodo();renderCal();window.addEventListener('scroll',()=>{let cur='time';if($('todoBlock').getBoundingClientRect().top<160)cur='todo';if($('otherBlock').getBoundingClientRect().top<160)cur='other';active(cur)},{passive:true})}init();
</script></body></html>
